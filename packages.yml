---
- name: install packages on these groups dev test prod
  hosts: dev test prod
  tasks:
    - name: Installing php and mariadb Package
      ansible.builtin.yum:
        name:
          - php
          - mariadb
        state: present

- name: Install Packages on dev group
  hosts: dev
  tasks:
    - name: Install RPM Development Tools
      ansible.builtin.yum:
        name: '@RPM Development Tools'
        state: present

    - name: update all the packages
      ansible.builtin.yum:
        name: '*'
        state: latest


